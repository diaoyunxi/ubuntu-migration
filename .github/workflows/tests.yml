name: tests

on:
  push:
    paths:
      - 'ubuntu-migration/**'
  pull_request:
    paths:
      - 'ubuntu-migration/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CMD script textual checks
        run: bash ubuntu-migration/tests/test_cmd_syntax.sh
      - name: Run Bash script syntax checks
        run: bash ubuntu-migration/tests/test_bash_syntax.sh

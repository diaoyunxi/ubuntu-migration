name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CMD script textual checks
        run: bash tests/test_cmd_syntax.sh
      - name: Run Bash script syntax checks
        run: bash tests/test_bash_syntax.sh
